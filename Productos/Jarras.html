<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseños de Jarras Cerveceras</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>

<header class="top-bar">
    <div class="top-content">
        <a href="../index.html" class="back-btn">←</a>
        <div class="titulo-area">
            <h1>Diseños de Jarras Cerveceras</h1>
            <p>Elige un diseño para empezar a personalizar.</p>
        </div>
    </div>

    <div class="filtros-container">
        <input type="text" id="searchInput" placeholder="Buscar diseños...">

        <div class="botones-filtro">
            <button class="activo">Todos</button>
            <button>Personalizable</button>
            <button>Papá</button>
            <button>Star Wars</button>
        </div>
    </div>
</header>

<div class="trabajo-card" data-tags="papá">
    <div class="trabajo-img">
        <img src="Diseños/Jarras/jarra_mockup_25x25cm_300dpi.png" alt="Trabajo">
    </div>

    <div class="trabajo-info">
        <h2>Papá es mi héroe favorito</h2>
    

        <div class="etiquetas">
            <span>Papá</span>
        </div>
    </div>
</div>

<div class="trabajo-card" data-tags="papá star wars">
    <div class="trabajo-img">
        <img src="Diseños/Jarras/jarra_mejor_padre_galaxia_25x25cm_300dpi.jpg" alt="Trabajo">
    </div>

    <div class="trabajo-info">
        <h2>Mejor padre de la Galaxia</h2>
    

        <div class="etiquetas">
            <span>Papá</span>
            <span>Star Wars</span>
        </div>
    </div>
</div>

<div class="trabajo-card" data-tags="papá">
    <div class="trabajo-img">
        <img src="Diseños/Jarras/Jarra_Mejor_papa_del_Mundo.png" alt="Trabajo">
    </div>

    <div class="trabajo-info">
        <h2>Mejor papá del mundo</h2>
    

        <div class="etiquetas">
            <span>Papá</span>
        </div>
    </div>
</div>

<script src="scripts2.js"></script>
</body>
</html>
